<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- BizNess OS — Dark version (for use on dark/navy backgrounds) -->

  <!-- Icon tile -->
  <rect x="0" y="8" width="64" height="64" rx="14" fill="#3B7FFF"/>
  <g transform="translate(32,40)">
    <path d="M -12,-19 L -12,19 L -4.5,19 C 16,19 16,0 -4.5,0 C 14,0 14,-19 -4.5,-19 Z" fill="#ffffff"/>
    <circle cx="15" cy="-16" r="5" fill="#00C87B"/>
    <circle cx="15" cy="-16" r="2.8" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text y="52" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="38" fill="#ffffff">
    <tspan x="82" font-weight="300">Biz</tspan><tspan font-weight="700">Ness</tspan>
  </text>

  <!-- OS badge -->
  <rect x="264" y="20" width="38" height="22" rx="11" fill="#3B7FFF"/>
  <text x="283" y="35.5" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700"
        fill="#ffffff" text-anchor="middle">OS</text>

  <!-- Tagline -->
  <text x="82" y="72" font-family="'Segoe UI',system-ui,sans-serif" font-size="11"
        fill="#8BA8E0" letter-spacing="1.5">Predict. Plan. Prosper.</text>
</svg>
