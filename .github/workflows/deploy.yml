

name: BizNess Backend CI/CD

# 1. This tells GitHub to run this script every time you push to the 'main' branch
on:
  push:
    branches:
      - main
jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (TESTING)
  # ==========================================
  test:
    name: Run Checks & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 # Linter to catch fatal errors

      - name: Run Syntax Linter
        run: |
          # This will instantly stop the pipeline if you have fatal Python syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (RENDER)
  # ==========================================
  deploy:
    name: Deploy to Render
    needs: test # THIS IS CRUCIAL: Deploy will ONLY run if the 'test' job passes
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render Deploy Hook
        # Uses the secret we just saved to securely tell Render to update
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}